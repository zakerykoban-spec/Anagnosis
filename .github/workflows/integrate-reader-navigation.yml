name: Integrate unified reader navigation

on:
  push:
    branches: [feat/unified-reader-navigation]

permissions:
  contents: write

concurrency:
  group: integrate-reader-navigation
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/unified-reader-navigation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reader integration
        run: python scripts/apply-unified-reader-navigation.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate Scripture data
        run: npm run scripture:validate

      - name: Validate STEP lexical data
        run: npm run scripture:validate:step

      - name: Build
        run: npm run build

      - name: Commit validated integration
        run: |
          rm scripts/apply-unified-reader-navigation.py
          rm .github/workflows/integrate-reader-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/readerContinuity.ts src/components/ReaderReferenceNavigator.tsx src/reader-navigation.css tests/reader-continuity.test.ts scripts/apply-unified-reader-navigation.py .github/workflows/integrate-reader-navigation.yml
          git commit -m "feat: add unified continuous reader navigation"
          git push origin HEAD:feat/unified-reader-navigation
