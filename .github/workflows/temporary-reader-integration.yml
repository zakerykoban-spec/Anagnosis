name: Temporary reader integration runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/unified-reader-navigation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/unified-reader-navigation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Correct integration-script indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-unified-reader-navigation.py')
          text = path.read_text(encoding='utf-8')
          old = '"      setFreeReadingBoundaryError(null)\\n\\n"'
          new = '"    setFreeReadingBoundaryError(null)\\n\\n"'
          if old not in text:
              raise SystemExit('Expected integration-script marker was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply reader integration
        run: python scripts/apply-unified-reader-navigation.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate Scripture data
        run: npm run scripture:validate

      - name: Validate STEP lexical data
        run: npm run scripture:validate:step

      - name: Build
        run: npm run build

      - name: Commit validated integration
        run: |
          rm scripts/apply-unified-reader-navigation.py
          rm .github/workflows/integrate-reader-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add unified continuous reader navigation"
          git push origin HEAD:feat/unified-reader-navigation
