name: Integrate unified reader navigation v2

on:
  push:
    branches: [feat/unified-reader-navigation]

permissions:
  contents: write

concurrency:
  group: integrate-reader-navigation-v2
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/unified-reader-navigation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reader integration
        run: python scripts/run-unified-reader-integration.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate Scripture data
        run: npm run scripture:validate

      - name: Validate STEP lexical data
        run: npm run scripture:validate:step

      - name: Build
        run: npm run build

      - name: Commit validated integration
        run: |
          rm -f scripts/apply-unified-reader-navigation.py
          rm -f scripts/run-unified-reader-integration.py
          rm -f .github/workflows/integrate-reader-navigation.yml
          rm -f .github/workflows/integrate-reader-navigation-v2.yml
          rm -f __trigger.txt __integration_marker.txt docs/.reader-navigation-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add unified continuous reader navigation"
          git push origin HEAD:feat/unified-reader-navigation
