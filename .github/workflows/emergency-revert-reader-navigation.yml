name: Emergency revert reader navigation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-revert-reader-navigation.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore the pre-PR-26 application state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-commit f3ac865e1bbb9b33526af9bbb2b391931f88291c
          rm .github/workflows/emergency-revert-reader-navigation.yml
          git add -A
          git commit -m "revert: restore reader before unified navigation"
          git push origin HEAD:main
